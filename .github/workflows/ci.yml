name: CI

on:
  push:
    branches-ignore: [main]  # mainブランチ以外のpush時
  pull_request:
    branches: [main]         # mainへのPR時

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: ldc_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run type-check
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"

      - name: Apply test database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://postgres:test-password@localhost:5432/ldc_test"

      - name: Run unit and submission integration tests
        run: npm run unit
        env:
          SUBMISSION_TEST_DATABASE_URL: "postgresql://postgres:test-password@localhost:5432/ldc_test"

      - name: Build test
        run: npm run build
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"

      - name: Check build output
        run: |
          if [ ! -d ".next" ]; then
            echo "❌ .next build directory not found"
            exit 1
          fi
          if [ ! -f ".next/BUILD_ID" ]; then
            echo "❌ BUILD_ID not generated"
            exit 1
          fi
          echo "✅ Next.js build artifacts verified"

